spring.application.name=uptime-monitor

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/uptime_monitor}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=true

logging.structured.format.console=logstash

management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db

monitoring.worker-threads=${MONITORING_WORKER_THREADS:4}
monitoring.queue-capacity=${MONITORING_QUEUE_CAPACITY:100}
monitoring.scheduler-delay-ms=${MONITORING_SCHEDULER_DELAY_MS:10000}
monitoring.retention-days=${MONITORING_RETENTION_DAYS:30}
monitoring.retention-cleanup-delay-ms=${MONITORING_RETENTION_CLEANUP_DELAY_MS:86400000}
monitoring.allow-private-targets=${MONITORING_ALLOW_PRIVATE_TARGETS:false}
monitoring.connect-timeout-ms=${MONITORING_CONNECT_TIMEOUT_MS:5000}
monitoring.read-timeout-ms=${MONITORING_READ_TIMEOUT_MS:5000}
